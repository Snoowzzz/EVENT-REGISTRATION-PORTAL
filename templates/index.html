<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 14px; margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 10px;
    }
    .name { font-weight: 600; margin: 0; }
    .seats { font-size: 13px; color: #666; margin: 2px 0 0; }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .badge.open { background: #e6f4ea; color: #1e7e34; }
    .badge.full { background: #fbe9e7; color: #c62828; }
    .bar-bg {
      height: 6px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .bar-fill { height: 100%; }
    .bar-fill.open { background: #2e7d32; }
    .bar-fill.full { background: #c62828; }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    button:hover:not(:disabled) { background: #f5f5f5; }
    #toast {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    #toast.success { background: #e6f4ea; color: #1e7e34; }
    #toast.error { background: #fbe9e7; color: #c62828; }
  </style>
</head>
<body>

  <h1>Event Registration Portal</h1>
  <p class="subtitle">Live seat availability, updates instantly on registration.</p>

  <div class="grid" id="cards"></div>
  <div id="toast"></div>

  <script>
    async function loadEvents() {
      const res = await fetch('/api/events');
      const events = await res.json();
      renderEvents(events);
    }

    function renderEvents(events) {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      events.forEach(ev => {
        const pct = Math.round((ev.seats_left / ev.seats_total) * 100);
        const full = ev.seats_left <= 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-head">
            <div>
              <p class="name">${ev.name}</p>
              <p class="seats">${ev.seats_left} of ${ev.seats_total} seats left</p>
            </div>
            <span class="badge ${full ? 'full' : 'open'}">${full ? 'Full' : 'Open'}</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill ${full ? 'full' : 'open'}" style="width:${pct}%"></div>
          </div>
          <button data-id="${ev.id}" ${full ? 'disabled' : ''}>
            ${full ? 'No seats left' : 'Register'}
          </button>
        `;
        container.appendChild(card);
      });

      container.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', () => register(btn.dataset.id));
      });
    }

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = isError ? 'error' : 'success';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    async function register(id) {
      const res = await fetch(`/register/${id}`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        showToast(`Registered. ${data.seats_left} seats left.`, false);
      } else {
        showToast(data.error, true);
      }
      loadEvents(); // refresh from server, source of truth
    }

    loadEvents();
  </script>
</body>
</html>
